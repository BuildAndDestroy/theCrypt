# Shared anonymity / anti-leak hardening for The Crypt.
# Included inside a server { } block by both the dev and prod nginx configs,
# so the two can never drift apart.

# Don't advertise the nginx version (fingerprinting).
server_tokens off;

# Never send a Referer off the onion (belt-and-braces with the per-page meta).
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;

# Lock every resource to this origin: the browser BLOCKS any attempt to load
# a font/script/image/pixel from off the onion. 'unsafe-inline' covers the
# inline year script and Bootstrap's inline style toggles.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
