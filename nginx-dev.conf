# Dev-only nginx config for The Crypt.
# The site source (./website) is bind-mounted at the web root so edits are
# live. Third-party vendor assets (Bootstrap + icons) are baked into the
# image under /opt/vendor. The production build minifies custom CSS/JS into
# *.min.* files; in dev we skip minification and rewrite those paths to the
# editable source instead.

server {
    listen 8080;                  # unprivileged nginx (non-root)
    server_name localhost;
    root /usr/share/nginx/html;   # = bind-mounted ./website
    index index.html;

    # --- Anonymity / anti-leak hardening (shared with production) ---
    include /etc/nginx/snippets/crypt-hardening.conf;

    # Vendor assets live in the image, not the source tree.
    location /dist/ { alias /opt/vendor/dist/; }
    location /font/ { alias /opt/vendor/font/; }

    # Serve editable source in place of the minified build artifacts.
    rewrite ^/css/custom-styles\.min\.css$        /css/custom-styles.css last;
    rewrite ^/biopsy-[0-9]+/js/countdown\.min\.js$ /js/countdown.js      last;

    location / {
        try_files $uri $uri/ =404;
    }
}
