# Dev-only nginx config for The Crypt.
# The site source (./website) is bind-mounted at the web root so edits are
# live. Third-party vendor assets (Bootstrap + icons) are baked into the
# image under /opt/vendor. The production build minifies custom CSS/JS into
# *.min.* files; in dev we skip minification and rewrite those paths to the
# editable source instead.

server {
    listen 8080;                  # unprivileged nginx (non-root)
    server_name localhost;
    root /usr/share/nginx/html;   # = bind-mounted ./website
    # Biopsy folders (/biopsy-N/) have no index.html; serve their page as the
    # folder default so the bare directory URL works instead of a 403.
    index index.html detailed-biopsy.html;

    # --- Anonymity / anti-leak hardening (shared with production) ---
    include /etc/nginx/snippets/crypt-hardening.conf;

    # Vendor assets live in the image, not the source tree.
    location /dist/ { alias /opt/vendor/dist/; }
    location /font/ { alias /opt/vendor/font/; }

    # Serve editable source in place of the minified build artifacts.
    rewrite ^/css/custom-styles\.min\.css$        /css/custom-styles.css last;
    rewrite ^/js/countdown\.min\.js$            /js/countdown.js       last;

    # Operator chat API (chat-api container). Only /api/* is proxied; the
    # API's /healthz stays internal. No add_header here: one in a location
    # block would drop the server-level hardening headers.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        client_max_body_size 16k;
        proxy_read_timeout 30s;
    }

    # Leak archives (dumps/, outside the web root). Served only once that
    # biopsy's deadline has passed: chat-api decides via auth_request (the
    # generated default or the operator's override). Anything else under
    # /biopsy-N/files/ is a plain 404, whether or not the file exists.
    location ~ "^/biopsy-(?<dump_n>[0-9]{1,4})/files/(?<dump_file>[A-Za-z0-9._-]+\.zip)$" {
        auth_request /_release;
        error_page 403 = @dump_locked;
        alias /usr/share/nginx/dumps/biopsy-$dump_n/$dump_file;
        default_type application/zip;
    }
    location ~ ^/biopsy-[0-9]+/files/ {
        return 404;
    }
    location @dump_locked {
        return 404;
    }
    location = /_release {
        internal;
        proxy_pass http://api:3000/internal/biopsies/release;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
