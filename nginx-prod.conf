# Production nginx server block for The Crypt hidden service.
# The site is served only on loopback inside the Pod; the Tor sidecar
# reaches it over 127.0.0.1:80 and publishes the onion. nginx never binds
# to a routable interface, so there is no clearnet surface.

server {
    listen 127.0.0.1:8080;       # loopback only; the Tor sidecar connects here
    server_name localhost;
    root /usr/share/nginx/html;
    # Biopsy folders (/biopsy-N/) have no index.html; serve their page as the
    # folder default so the bare directory URL works instead of a 403.
    index index.html detailed-biopsy.html;

    include /etc/nginx/snippets/crypt-hardening.conf;

    # Operator chat API (chat-api container). Only /api/* is proxied; the
    # API's /healthz stays internal. No add_header here: one in a location
    # block would drop the server-level hardening headers.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        client_max_body_size 16k;
        proxy_read_timeout 30s;
    }

    # Operator archive upload (chat-api). Streamed through, with a larger body
    # limit than the 16k /api/ cap; still operator-only and size-capped server
    # side. Matches before the generic /api/ location.
    location ~ ^/api/admin/biopsies/[0-9]+/archive$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        client_max_body_size 65m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # Leak archives (dumps/, outside the web root). chat-api decides whether the
    # deadline has passed and whether to serve the generated default or an
    # operator-uploaded override; it streams an override, or hands the default
    # back to nginx via X-Accel-Redirect (/_dump_static below). Anything else
    # under /biopsy-N/files/ is a plain 404, whether or not the file exists.
    location ~ "^/biopsy-[0-9]{1,4}/files/[A-Za-z0-9._-]+\.zip$" {
        proxy_pass http://127.0.0.1:3000;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 60s;
    }
    location ~ ^/biopsy-[0-9]+/files/ {
        return 404;
    }
    # Generated default archives, baked into the image; reachable only through
    # the X-Accel-Redirect chat-api returns above, never directly.
    location /_dump_static/ {
        internal;
        alias /usr/share/nginx/dumps/;
        default_type application/zip;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
