name: SAST

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write   # upload SARIF to code scanning

jobs:
  codeql:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9  # v3.39.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9  # v3.39.3
        with:
          category: "/language:javascript-typescript"

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Run Semgrep
        run: semgrep scan --config auto --sarif --output semgrep.sarif
        continue-on-error: true
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9  # v3.39.3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true
