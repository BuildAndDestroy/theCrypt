# The Crypt — self-contained hidden service (Tor sidecar).
#
# One Pod, two containers:
#   * nginx  — serves the static site, unprivileged, bound to 127.0.0.1:8080.
#   * tor    — publishes the hidden service and forwards the onion's port 80
#              to nginx over the Pod's shared loopback.
#
# nginx never binds a routable interface: no clearnet surface, nothing for the
# cluster network to reach. No Service/Ingress is needed — Tor IS the ingress.
#
# The onion identity (private key) lives ONLY in a Secret, never in an image
# or in git. Create it from your existing tor/hidden_service directory:
#
#   kubectl -n tor-hidden-ns create secret generic onion-key \
#     --from-file=hs_ed25519_secret_key=tor/hidden_service/hs_ed25519_secret_key \
#     --from-file=hs_ed25519_public_key=tor/hidden_service/hs_ed25519_public_key \
#     --from-file=hostname=tor/hidden_service/hostname
---
apiVersion: v1
kind: Namespace
metadata:
  name: tor-hidden-ns
---
# Pull secret for your private registry. Populate before applying, e.g.:
#   kubectl -n tor-hidden-ns create secret docker-registry myregistrykey \
#     --docker-server=registry.yourregistry.com \
#     --docker-username=USER --docker-password=PASS
apiVersion: v1
kind: Secret
metadata:
  name: myregistrykey
  namespace: tor-hidden-ns
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: ""   # <-- fill in, or create via the command above
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: torrc
  namespace: tor-hidden-ns
data:
  torrc: |
    # Host-only: no SOCKS proxy, we are not a client.
    SocksPort 0
    DataDirectory /var/lib/tor
    HiddenServiceDir /var/lib/tor/hidden_service
    HiddenServiceVersion 3
    # Onion port 80 -> nginx sidecar (unprivileged, 8080) over Pod loopback.
    HiddenServicePort 80 127.0.0.1:8080
    Log notice stderr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thecrypt
  namespace: tor-hidden-ns
  labels:
    app: thecrypt
spec:
  # Keep at 1: the onion identity is a single private key. Scaling out means
  # OnionBalance (multiple descriptors, one .onion) — a deliberate extra step.
  replicas: 1
  selector:
    matchLabels:
      app: thecrypt
  template:
    metadata:
      labels:
        app: thecrypt
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: myregistrykey
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000            # makes the onion-key Secret readable by uid 1000
        seccompProfile:
          type: RuntimeDefault
      # Stage the onion key into the writable DataDirectory with the perms Tor
      # demands (dir 0700, files 0600). fsGroup lets this run as non-root: no
      # chown needed, so no root initContainer.
      initContainers:
      - name: stage-onion-key
        image: busybox:1.36.1
        command:
        - sh
        - -c
        - |
          mkdir -p /var/lib/tor/hidden_service
          cp -L /onion-key/* /var/lib/tor/hidden_service/
          chmod 700 /var/lib/tor/hidden_service
          chmod 600 /var/lib/tor/hidden_service/*
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests: { cpu: "10m", memory: "16Mi" }
          limits:   { cpu: "50m", memory: "32Mi" }
        volumeMounts:
        - name: onion-key
          mountPath: /onion-key
          readOnly: true
        - name: tor-data
          mountPath: /var/lib/tor
      containers:
      - name: nginx
        image: registry.yourregistry.com/thecrypt-website:1.0.0
        ports:
        - containerPort: 8080     # informational; bound to 127.0.0.1 in nginx
        readinessProbe:
          tcpSocket: { port: 8080 }
          initialDelaySeconds: 2
          periodSeconds: 10
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests: { cpu: "10m", memory: "16Mi" }
          limits:   { cpu: "100m", memory: "64Mi" }
        volumeMounts:
        - name: nginx-tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
      - name: tor
        image: registry.yourregistry.com/thecrypt-tor:1.0.0
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests: { cpu: "25m", memory: "32Mi" }
          limits:   { cpu: "250m", memory: "128Mi" }
        volumeMounts:
        - name: torrc
          mountPath: /etc/tor/torrc
          subPath: torrc
          readOnly: true
        - name: tor-data
          mountPath: /var/lib/tor
      volumes:
      - name: torrc
        configMap:
          name: torrc
      - name: onion-key
        secret:
          secretName: onion-key
          defaultMode: 0440
      - name: tor-data
        emptyDir: {}
      - name: nginx-tmp
        emptyDir: {}
      - name: nginx-cache
        emptyDir: {}
