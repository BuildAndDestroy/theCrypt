# The Crypt — self-contained hidden service (Tor sidecar).
#
# One Pod, three containers:
#   * nginx    — serves the static site, unprivileged, bound to 127.0.0.1:8080,
#                and proxies /api/* to chat-api.
#   * chat-api — operator chat backend, bound to 127.0.0.1:3000. Talks to
#                MongoDB (kubernetes/mongodb.yaml) for accounts + chat logs.
#   * tor      — publishes the hidden service and forwards the onion's port 80
#                to nginx over the Pod's shared loopback.
#
# Nothing binds a routable interface: no clearnet surface, nothing for the
# cluster network to reach. No Service/Ingress is needed — Tor IS the ingress.
#
# chat-api reads two Secrets (never committed), mounted as files under
# /run/secrets/ (not environment variables):
#   * mongo-auth — see kubernetes/mongodb.yaml (app_username / app_password)
#   * chat-admin — the predefined operator account:
#       kubectl -n tor-hidden-ns create secret generic chat-admin \
#         --from-literal=email=operator@example.invalid \
#         --from-literal=password="$(openssl rand -base64 24)" \
#         --from-literal=totp_secret="$(head -c 20 /dev/urandom | base32)"
#     totp_secret is optional but strongly recommended: the login page is on
#     the onion, reachable by anyone. Add it to your authenticator app.
#
# The onion identity (private key) lives ONLY in a Secret, never in an image
# or in git. Create it from your existing tor/hidden_service directory:
#
#   kubectl -n tor-hidden-ns create secret generic onion-key \
#     --from-file=hs_ed25519_secret_key=tor/hidden_service/hs_ed25519_secret_key \
#     --from-file=hs_ed25519_public_key=tor/hidden_service/hs_ed25519_public_key \
#     --from-file=hostname=tor/hidden_service/hostname
---
apiVersion: v1
kind: Namespace
metadata:
  name: tor-hidden-ns
---
# The registry pull secret (myregistrykey) is created with kubectl, not here,
# so re-applying this file never overwrites it with an empty placeholder:
#   kubectl -n tor-hidden-ns create secret docker-registry myregistrykey \
#     --docker-server=registry.yourregistry.com \
#     --docker-username=USER --docker-password=PASS
apiVersion: v1
kind: ConfigMap
metadata:
  name: torrc
  namespace: tor-hidden-ns
data:
  torrc: |
    # Host-only: no SOCKS proxy, we are not a client.
    SocksPort 0
    # A subdir the initContainer creates as the Tor UID (0700): the emptyDir
    # root itself is owned by root, which Tor refuses as a DataDirectory.
    DataDirectory /var/lib/tor/data
    HiddenServiceDir /var/lib/tor/hidden_service
    HiddenServiceVersion 3
    # Onion port 80 -> nginx sidecar (unprivileged, 8080) over Pod loopback.
    HiddenServicePort 80 127.0.0.1:8080
    Log notice stderr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thecrypt
  namespace: tor-hidden-ns
  labels:
    app: thecrypt
  annotations:
    # Images are placeholders for your registry; pin them by sha256 digest at
    # deploy time (imagePullPolicy: Always is set in the meantime).
    checkov.io/skip1: CKV_K8S_43=Placeholder registry; pin by digest at deploy time
spec:
  # Keep at 1: the onion identity is a single private key. Scaling out means
  # OnionBalance (multiple descriptors, one .onion) — a deliberate extra step.
  replicas: 1
  selector:
    matchLabels:
      app: thecrypt
  template:
    metadata:
      labels:
        app: thecrypt
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: myregistrykey
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001           # makes the onion-key Secret readable by the app UID
        seccompProfile:
          type: RuntimeDefault
      # Stage the onion key into the writable DataDirectory with the perms Tor
      # demands (dir 0700, files 0600). fsGroup lets this run as non-root: no
      # chown needed, so no root initContainer.
      initContainers:
      - name: stage-onion-key
        image: busybox:1.36.1
        imagePullPolicy: Always
        command:
        - sh
        - -c
        - |
          mkdir -p /var/lib/tor/data /var/lib/tor/hidden_service
          chmod 700 /var/lib/tor/data
          cp -L /onion-key/* /var/lib/tor/hidden_service/
          chmod 700 /var/lib/tor/hidden_service
          chmod 600 /var/lib/tor/hidden_service/*
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests: { cpu: "10m", memory: "16Mi" }
          limits:   { cpu: "50m", memory: "32Mi" }
        volumeMounts:
        - name: onion-key
          mountPath: /onion-key
          readOnly: true
        - name: tor-data
          mountPath: /var/lib/tor
      containers:
      - name: nginx
        image: registry.yourregistry.com/thecrypt-website:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080     # informational; bound to 127.0.0.1 in nginx
        # nginx is bound to 127.0.0.1 only, so the kubelet (which probes the
        # Pod IP) can't reach it with tcpSocket/httpGet; probe from inside.
        readinessProbe:
          exec:
            command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
          initialDelaySeconds: 2
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
          initialDelaySeconds: 5
          periodSeconds: 20
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests: { cpu: "10m", memory: "16Mi" }
          limits:   { cpu: "100m", memory: "64Mi" }
        volumeMounts:
        - name: nginx-tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
      - name: chat-api
        image: registry.yourregistry.com/thecrypt-chat-api:1.0.0
        imagePullPolicy: Always
        env:
        - name: LISTEN_HOST
          value: "127.0.0.1"        # Pod loopback only; nginx proxies to it
        - name: MONGO_HOST
          value: thecrypt-mongo.tor-hidden-ns.svc.cluster.local:27017
        - name: MONGO_DB
          value: thecrypt
        # Credentials are mounted as files (not env vars), so they never sit
        # in the process environment. The API reads NAME_FILE for each NAME.
        - name: MONGO_USERNAME_FILE
          value: /run/secrets/mongo/app_username
        - name: MONGO_PASSWORD_FILE
          value: /run/secrets/mongo/app_password
        - name: ADMIN_EMAIL_FILE
          value: /run/secrets/admin/email
        - name: ADMIN_PASSWORD_FILE
          value: /run/secrets/admin/password
        - name: ADMIN_TOTP_SECRET_FILE
          value: /run/secrets/admin/totp_secret   # optional key
        volumeMounts:
        - name: mongo-app-credentials
          mountPath: /run/secrets/mongo
          readOnly: true
        - name: chat-admin
          mountPath: /run/secrets/admin
          readOnly: true
        # Bound to loopback, so probe from inside the container.
        readinessProbe:
          exec:
            command: ["node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command: ["node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(()=>process.exit(0),()=>process.exit(1))"]
          initialDelaySeconds: 60     # allows for the Mongo connect retry loop
          periodSeconds: 30
          timeoutSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          # Password hashing (scrypt) uses ~32 MiB each, max 2 at a time.
          requests: { cpu: "25m", memory: "64Mi" }
          limits:   { cpu: "500m", memory: "256Mi" }
      - name: tor
        image: registry.yourregistry.com/thecrypt-tor:1.0.0
        imagePullPolicy: Always
        # Tor exposes no local port (SocksPort 0); probe the published onion
        # hostname file that Tor writes once the service is up.
        readinessProbe:
          exec:
            command: ["sh", "-c", "test -f /var/lib/tor/hidden_service/hostname"]
          initialDelaySeconds: 5
          periodSeconds: 15
        livenessProbe:
          exec:
            command: ["sh", "-c", "test -f /var/lib/tor/hidden_service/hostname"]
          initialDelaySeconds: 30
          periodSeconds: 30
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests: { cpu: "25m", memory: "32Mi" }
          limits:   { cpu: "250m", memory: "128Mi" }
        volumeMounts:
        - name: torrc
          mountPath: /etc/tor/torrc
          subPath: torrc
          readOnly: true
        - name: tor-data
          mountPath: /var/lib/tor
      volumes:
      - name: torrc
        configMap:
          name: torrc
      - name: onion-key
        secret:
          secretName: onion-key
          defaultMode: 0440
      - name: tor-data
        emptyDir: {}
      - name: nginx-tmp
        emptyDir: {}
      - name: nginx-cache
        emptyDir: {}
      # Mounted into chat-api only. Just the app user: chat-api never sees
      # MongoDB's root credentials.
      - name: mongo-app-credentials
        secret:
          secretName: mongo-auth
          defaultMode: 0440
          items:
          - { key: app_username, path: app_username }
          - { key: app_password, path: app_password }
      - name: chat-admin
        secret:
          secretName: chat-admin
          defaultMode: 0440
---
# Deny all inbound to the Pod (nothing should reach it directly — Tor connects
# outbound to the network and serves over Pod loopback). Allow all egress so
# Tor can reach guard/relay nodes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: thecrypt
  namespace: tor-hidden-ns
spec:
  podSelector:
    matchLabels:
      app: thecrypt
  policyTypes:
  - Ingress
  - Egress
  ingress: []       # deny all inbound
  egress:
  - {}              # allow all outbound (Tor needs arbitrary relay egress)
